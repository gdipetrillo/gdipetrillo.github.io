<!DOCTYPE html>
<html>
<head>
  <!-- QUESTA RIGA È FONDAMENTALE PER I CELLULARI -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    /* 1. REGOLE GENERALI */
    body { 
      margin: 0; 
      background-color: #fcfcfc; 
      color: #333333; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7; 
      font-size: 17px; 
    }
    
    /* 2. LA BARRA DI NAVIGAZIONE CHIARA ED ELEGANTE */
    .nav-container { 
      background-color: rgba(252, 252, 252, 0.95); /* Chiara e quasi trasparente */
      border-bottom: 1px solid #eaeaea; /* Riga sottile per separare */
      position: sticky;  
      top: 0;            
      z-index: 1000;
      padding: 15px 40px;
      display: flex;
      justify-content: flex-end; /* Su Desktop i link stanno a destra */
      align-items: center;
    }
    
    /* Il contenitore dei link */
    .nav-links {
      display: flex;
      gap: 30px; /* Spazio tra i link */
    }

    .nav-links a { 
      color: #555555; 
      text-decoration: none;     
      font-weight: normal; /* Niente grassetto pesante */
      font-size: 16px;
      transition: color 0.2s;
    }
    
    .nav-links a:hover {
      color: #2c5282; /* Diventa di un blu polvere elegante quando ci passi sopra */
    }

    /* Le 3 righine (nascoste su desktop) */
    .hamburger {
      display: none;
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: #333;
      padding: 0;
    }

    /* 3. LA MAGIA PER IL CELLULARE (Schermi sotto i 768px) */
    @media screen and (max-width: 768px) {
      .nav-container {
        justify-content: flex-start; /* Sposta le 3 righine a sinistra */
        padding: 15px 20px;
      }
      
      .hamburger {
        display: block; /* Fa apparire le 3 righine */
      }

      .nav-links {
        display: none; /* Nasconde i link classici */
        flex-direction: column; /* Li mette in colonna */
        position: absolute;
        top: 100%; /* Sotto la barra */
        left: 0;
        width: 100%;
        background-color: #fcfcfc;
        border-bottom: 1px solid #eaeaea;
        padding: 0; /* Tolgo il padding per farlo full-width */
        box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* Leggera ombreggiatura sotto */
      }

      .nav-links.active {
        display: flex; /* Fa apparire il menù quando si clicca */
      }

      .nav-links a {
        padding: 15px 20px; /* Spazio cliccabile bello grande per le dita */
        border-top: 1px solid #f0f0f0;
      }
    }

    /* 4. REGOLE DEL TESTO (La gabbia per i tuoi contenuti) */
    .content { 
      max-width: 1250px;  
      margin: 40px auto; 
      padding: 0 40px;    
      text-align: left;   
    }
    .content h1 { text-align: center; margin-bottom: 40px; }
    .content a { color: #2c5282; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s; }
    .content a:hover { border-bottom: 1px solid #2c5282; }
  </style>
</head>
<body>

  <!-- LA NUOVA BARRA -->
  <div class="nav-container">
    <!-- Il bottone con le 3 righine, invoca lo script javascript qui sotto -->
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    
    <!-- I tuoi link -->
    <div class="nav-links" id="myLinks">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="teaching.html">Teaching</a>
    </div>
  </div>

  <!-- IL TITOLO GIGANTE DELLA PAGINA (Colore neutro antracite) -->
  <div style="text-align: center; margin-bottom: 50px; padding: 40px 20px;">
    <h1 style="color: #1a1a1a; font-size: 3em; margin: 0; font-weight: normal; letter-spacing: -1px;">{{ page.title }}</h1>
    {% if page.subtitle %}
      <h2 style="color: #777; font-weight: normal; margin-top: 10px;">{{ page.subtitle }}</h2>
    {% endif %}
  </div>

  <!-- IL CONTENUTO -->
  <div class="content">
    {{ content }}
  </div>

  <!-- MICRO-SCRIPT PER FAR FUNZIONARE LE 3 RIGHINE -->
  <script>
    function toggleMenu() {
      var nav = document.getElementById("myLinks");
      // Seleziona o deseleziona la classe "active" per far apparire/scomparire la tendina
      nav.classList.toggle("active");
    }
  </script>

</body>
</html>
