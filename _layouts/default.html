<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    /* REGOLE GENERALI */
    body { 
      margin: 0; 
      background-color: #fcfcfc; 
      color: #333333; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7; 
      font-size: 17px; 
    }
    
    /* 1. LA BARRA COLORATA E TRASLUCIDA */
    .nav-container { 
      background-color: rgba(226, 237, 248, 0.85); /* Azzurro polvere semitrasparente */
      backdrop-filter: blur(8px); /* Effetto vetro */
      border-bottom: 1px solid rgba(200, 215, 230, 0.5); /* Righetta in tinta */
      position: sticky;  
      top: 0;            
      z-index: 1000;
      padding: 15px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    
    .nav-links { display: flex; gap: 30px; }

    .nav-links a { 
      color: #2c5282; /* Blu elegante per i link, che si sposa con lo sfondo azzurrino */
      text-decoration: none;     
      font-weight: 500; 
      font-size: 16px;
      transition: color 0.2s;
    }
    
    .nav-links a:hover { color: #1a365d; } /* Blu più scuro al passaggio del mouse */

    .hamburger {
      display: none;
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: #2c5282; /* Hamburger colorato in tinta */
      padding: 0;
    }

    /* 2. LA GRIGLIA DELLA HOME (Gestita qui per essere reattiva) */
    .home-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 40px;
      align-items: start;
      text-align: left;
    }

    /* REGOLE PER IL CELLULARE (Schermi sotto i 768px) */
    @media screen and (max-width: 768px) {
      .nav-container { justify-content: flex-start; padding: 15px 20px; }
      .hamburger { display: block; }
      
      .nav-links {
        display: none; 
        flex-direction: column; 
        position: absolute;
        top: 100%; 
        left: 0;
        width: 100%;
        background-color: rgba(240, 246, 252, 0.98); /* Tendina quasi opaca ma sempre azzurrina */
        padding: 0; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .nav-links.active { display: flex; }
      .nav-links a { padding: 15px 20px; border-top: 1px solid rgba(200, 215, 230, 0.3); }

      /* LA MAGIA PER LA HOME SU CELLULARE: diventa una colonna sola! */
      .home-grid {
        grid-template-columns: 1fr; /* 1 frazione (tutto lo spazio disponibile) */
        gap: 20px; /* Riduce un po' lo spazio tra foto e testo */
      }
    }

    /* REGOLE DEL TESTO */
    .content { max-width: 1250px; margin: 40px auto; padding: 0 40px; text-align: left; }
    .content h1 { text-align: center; margin-bottom: 40px; }
    .content a { color: #2c5282; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s; }
    .content a:hover { border-bottom: 1px solid #2c5282; }
  </style>
</head>
<body>

  <div class="nav-container">
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <div class="nav-links" id="myLinks">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="teaching.html">Teaching</a>
    </div>
  </div>

  <div style="text-align: center; margin-bottom: 50px; padding: 40px 20px;">
    <h1 style="color: #1a1a1a; font-size: 3em; margin: 0; font-weight: normal; letter-spacing: -1px;">{{ page.title }}</h1>
    {% if page.subtitle %}
      <h2 style="color: #777; font-weight: normal; margin-top: 10px;">{{ page.subtitle }}</h2>
    {% endif %}
  </div>

  <div class="content">
    {{ content }}
  </div>

  <script>
    function toggleMenu() {
      var nav = document.getElementById("myLinks");
      nav.classList.toggle("active");
    }
  </script>
</body>
</html>
